<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>במקום לשבור את הגיטרה – ארפג'יו באצבעות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07090d;--fg:#f4f1ea;--accent:#ffd23f}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Heebo,'Liberation Sans','DejaVu Sans',Arial,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
  #stage{position:relative;height:calc(100vh - 96px);aspect-ratio:9/16;max-width:100%;border-radius:18px;overflow:hidden;box-shadow:0 10px 60px #000a}
  canvas{width:100%;height:100%;display:block}
  #big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0006;border:0;cursor:pointer;color:#fff;font:900 28px Heebo,sans-serif}
  #big span{background:var(--accent);color:#111;padding:16px 28px;border-radius:999px;box-shadow:0 6px 30px #0008}
  #bar{display:flex;align-items:center;gap:12px;width:min(560px,100%)}
  #bar button{background:#1b2230;color:var(--fg);border:1px solid #ffffff22;border-radius:10px;padding:8px 14px;font:700 15px Heebo,sans-serif;cursor:pointer}
  #bar button:focus-visible,#big:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #bar input{flex:1;accent-color:var(--accent)}
  body.render #bar,body.render #big{display:none}
  body.render{padding:0;gap:0}
  body.render #stage{height:1920px;width:1080px;border-radius:0;box-shadow:none}
  @media (prefers-reduced-motion:reduce){#big span{box-shadow:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920" aria-label="סרטון טיפ לגיטרה: ארפג'יו באצבעות"></canvas>
  <button id="big" aria-label="הפעל את הסרטון עם סאונד"><span>▶ הפעל עם סאונד</span></button>
</div>
<div id="bar">
  <button id="pp">⏯ עצור / נגן</button>
  <input id="seek" type="range" min="0" max="1000" value="0" aria-label="ציר זמן">
  <button id="rs">↺ מההתחלה</button>
</div>

<script>
/* =====================================================================
   סרטון טיפ לגיטרה — הכול מצויר בקוד. renderFrame(t) היא פונקציה דטרמיניסטית
   של הזמן, ולכן אפשר גם לנגן בדפדפן וגם לרנדר ל-MP4 (render.js).
   ===================================================================== */
const W = 1080, H = 1920, DUR = 25.4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const QS = new URLSearchParams(location.search);
if (QS.has('render')) document.body.classList.add('render');

/* ---------- ציר הזמן ---------- */
const T_SLAM = 1.5;   // רגע הריסוק
const T_X    = 2.9;   // ה-X האדום
const T_TXT1 = 3.3;   // "במקום לשבור את הגיטרה"
const T_TXT2 = 4.1;   // "בואו תעשו את זה"
const T_SW   = 5.0;   // מעבר לסצנת הנגינה
const T_PLAY = 5.5;   // התו הראשון
const BEAT = 0.32, BAR = BEAT * 6, NBARS = 8;
const T_END_PLAY = T_PLAY + BAR * NBARS;   // ≈ 20.86

/* ---------- עזרים ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const eIn = k => k * k * k, eOut = k => 1 - Math.pow(1 - k, 3);
const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const eBack = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FONT = "Heebo,'Liberation Sans','DejaVu Sans',Arial,sans-serif";
const C = { yellow: '#ffd23f', coral: '#ff6b4a', teal: '#2ec4b6', blue: '#7aa2ff', skin: '#efb88f', skinD: '#d79a72', shirt: '#e86a33', shirtD: '#c4501f', jeans: '#26334a', hair: '#1c1512' };
const FINGER_COL = { p: C.coral, i: C.yellow, m: C.teal, a: C.blue };

function text(s, x, y, size, o = {}) {
  const heb = /[֐-׿]/.test(s);
  ctx.save();
  ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); if (o.scale != null) ctx.scale(o.scale, o.scale);
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = `${o.weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.direction = heb ? 'rtl' : 'ltr';
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = o.shadowBlur ?? 24; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.strokeW || size * .14; ctx.strokeStyle = o.stroke; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(s, 0, 0);
  ctx.restore();
}
const popScale = (t, t0, d = .28) => t < t0 ? 0 : eBack(seg(t, t0, t0 + d));
function limb(pts, w, col) { ctx.save(); ctx.lineCap = ctx.lineJoin = 'round'; ctx.lineWidth = w; ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) ctx.lineTo(...pts[i]); ctx.stroke(); ctx.restore(); }
function circ(x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
/* IK של שתי מפרקים: מחזיר [מרפק, כף יד] ; pv = כיוון מועדף למרפק */
function ik(sx, sy, tx, ty, l1, l2, pv) {
  let dx = tx - sx, dy = ty - sy, d = Math.hypot(dx, dy) || 1;
  const maxD = (l1 + l2) * .999, minD = Math.abs(l1 - l2) + 2;
  const dd = clamp(d, minD, maxD); const ux = dx / d, uy = dy / d;
  const a = (l1 * l1 - l2 * l2 + dd * dd) / (2 * dd), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const bx = sx + ux * a, by = sy + uy * a;
  const c1 = [bx - uy * h, by + ux * h], c2 = [bx + uy * h, by - ux * h];
  const sc = c => (c[0] - bx) * pv[0] + (c[1] - by) * pv[1];
  const e = sc(c1) > sc(c2) ? c1 : c2;
  return [e, [sx + ux * dd, sy + uy * dd]];
}
function arm(sh, target, pv, l1 = 195, l2 = 185) {
  const [e, h] = ik(sh[0], sh[1], target[0], target[1], l1, l2, pv);
  limb([sh, e], 62, C.shirt); limb([e, h], 46, C.skin); circ(sh[0], sh[1], 42, C.shirt);
  return h;
}

/* ---------- גיטרה (קואורדינטות מקומיות: x לאורך הצוואר) ---------- */
const NUT = 520, SCALE_L = 900, BRIDGE = -200;
const fretX = n => NUT - SCALE_L * (1 - Math.pow(2, -n / 12));
const spAt = x => lerp(16, 10, (x - BRIDGE) / (NUT - BRIDGE));
const strY = (s, x) => (3.5 - s) * spAt(x);          // מיתר 1 (e דק) למטה, מיתר 6 (E בס) למעלה
const gw = (P, lx, ly) => { const c = Math.cos(P.a), s = Math.sin(P.a); return [P.x + lx * c - ly * s, P.y + lx * s + ly * c]; };

function bodyPath() {
  const p = new Path2D();
  p.ellipse(-125, 0, 130, 150, 0, 0, 7);
  p.ellipse(55, 0, 80, 100, 0, 0, 7);
  p.rect(-40, -78, 100, 156);
  return p;
}
const BODY = bodyPath();
function drawGuitar(vib) {
  // צל
  ctx.save(); ctx.shadowColor = '#0008'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#b8691f'; ctx.fill(BODY); ctx.restore();
  const g = ctx.createRadialGradient(-110, -30, 20, -90, 0, 220);
  g.addColorStop(0, '#f2a64f'); g.addColorStop(.6, '#d98b3a'); g.addColorStop(1, '#a8601c');
  ctx.fillStyle = g; ctx.fill(BODY);
  ctx.lineWidth = 9; ctx.strokeStyle = '#5a3210'; ctx.stroke(BODY);
  ctx.lineWidth = 3; ctx.strokeStyle = '#f6d9a2'; ctx.save(); ctx.scale(.93, .93); ctx.stroke(BODY); ctx.restore();
  // צוואר
  ctx.fillStyle = '#7a4a22'; ctx.beginPath(); ctx.roundRect(90, -33, NUT - 85, 66, 6); ctx.fill();
  ctx.fillStyle = '#2b1a10'; ctx.beginPath(); ctx.roundRect(95, -30, NUT - 95, 60, 4); ctx.fill();
  // פרטים
  for (const n of [3, 5, 7, 9]) circ((fretX(n) + fretX(n - 1)) / 2, 0, 5, '#e9dcc0');
  ctx.strokeStyle = '#c9ccd2'; ctx.lineWidth = 3;
  for (let n = 1; n <= 10; n++) { const x = fretX(n); ctx.beginPath(); ctx.moveTo(x, -30); ctx.lineTo(x, 30); ctx.stroke(); }
  ctx.fillStyle = '#efe7d2'; ctx.fillRect(NUT - 3, -31, 7, 62);
  // ראש
  ctx.fillStyle = '#2b1a10'; ctx.beginPath(); ctx.roundRect(NUT + 4, -40, 95, 80, 12); ctx.fill();
  for (let i = 0; i < 3; i++) for (const sy of [-1, 1]) { circ(NUT + 30 + i * 28, sy * 48, 10, '#d8d8d8'); }
  // פתח תהודה + גשר
  circ(-5, 0, 50, '#150d07'); ctx.lineWidth = 7; ctx.strokeStyle = '#f0c987'; ctx.beginPath(); ctx.arc(-5, 0, 56, 0, 7); ctx.stroke();
  ctx.fillStyle = '#2b1a10'; ctx.beginPath(); ctx.roundRect(BRIDGE - 12, -62, 26, 124, 8); ctx.fill();
  // מיתרים
  for (let s = 1; s <= 6; s++) {
    ctx.strokeStyle = s >= 4 ? '#d3b866' : '#e9ecf0'; ctx.lineWidth = 1.6 + (s - 1) * .55;
    const A = vib && vib[s] ? vib[s] : null;
    ctx.beginPath();
    if (!A) { ctx.moveTo(BRIDGE, strY(s, BRIDGE)); ctx.lineTo(NUT, strY(s, NUT)); }
    else for (let k = 0; k <= 40; k++) {
      const x = lerp(BRIDGE, NUT, k / 40), off = A.amp * Math.sin(Math.PI * k / 40) * Math.cos(A.ph);
      k ? ctx.lineTo(x, strY(s, x) + off) : ctx.moveTo(x, strY(s, x) + off);
    }
    ctx.stroke();
  }
}

/* =====================================================================
   סצנה 1 — ההוק
   ===================================================================== */
const FLOOR = 1450, HIP = [360, 1190], GR = 300;
const GDEG = d => d * Math.PI / 180;
function hookPose(t) {
  let th, G, lean;
  if (t < 0.9) { const tr = Math.sin(t * 60) * GDEG(1.3) * (0.4 + t); th = GDEG(90) + tr; G = [400 + Math.sin(t * 47) * 3, 560]; lean = 0; }
  else if (t < 1.25) { const k = eIO(seg(t, .9, 1.25)); th = lerp(GDEG(90), GDEG(55), k); G = [lerp(400, 330, k), lerp(560, 520, k)]; lean = lerp(0, -.12, k); }
  else { const k = Math.pow(seg(t, 1.25, T_SLAM), 2.2); th = lerp(GDEG(55), GDEG(215), k); G = [lerp(330, 470, k), lerp(520, 1085, k)]; lean = lerp(-.12, .35, k); }
  const Pb = { a: th, x: G[0] - GR * Math.cos(th), y: G[1] - GR * Math.sin(th) };
  return { th, G, lean, P: Pb };
}
const IMPACT = hookPose(T_SLAM);

/* שברי הגיטרה: מחיצת ריבוע ל-18 תאים משוננים */
const PIECES = (function () {
  const r0 = rng(11);
  const xs = [-260, -140, -30, 95, 250, 420, 625], ys = [-175, 0, 175], N = [];
  for (let i = 0; i < xs.length; i++) { N[i] = []; for (let j = 0; j < 3; j++) N[i][j] = [xs[i] + ((i && i < 6) ? (r0() - .5) * 40 : 0), ys[j] + (j === 1 ? (r0() - .5) * 50 : 0)]; }
  const hsh = (a, b) => { const [p, q] = (a[0] < b[0] || (a[0] === b[0] && a[1] < b[1])) ? [a, b] : [b, a]; const v = Math.sin(p[0] * 12.9898 + p[1] * 78.233 + q[0] * 37.719 + q[1] * 4.581) * 43758.5453; return v - Math.floor(v); };
  const zig = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, o = (hsh(a, b) - .5) * 34; return [(a[0] + b[0]) / 2 - dy / L * o, (a[1] + b[1]) / 2 + dx / L * o]; };
  const cells = [];
  for (let i = 0; i < 6; i++) {
    if (i < 3) { cells.push([N[i][0], N[i + 1][0], N[i + 1][1], N[i][1]]); cells.push([N[i][1], N[i + 1][1], N[i + 1][2], N[i][2]]); }
    else cells.push([N[i][0], N[i + 1][0], N[i + 1][1], N[i + 1][2], N[i][2], N[i][1]]);
  }
  const r = rng(5), P0 = gw(IMPACT.P, -125 + 60, 130);
  return cells.map((c, idx) => {
    const poly = []; for (let k = 0; k < c.length; k++) { poly.push(c[k]); poly.push(zig(c[k], c[(k + 1) % c.length])); }
    const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length, cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
    const [wx, wy] = gw(IMPACT.P, cx, cy);
    let dx = wx - P0[0], dy = wy - P0[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const sp = 280 + r() * 520;
    return { poly, cx, cy, x0: wx, y0: wy, vx: dx * sp + (r() - .5) * 220, vy: -(520 + r() * 760) + dy * 120, w: (r() - .5) * 15, ph: 38 };
  });
})();
const STRINGS_FLY = (function () {
  const r = rng(99), o = []; const P0 = gw(IMPACT.P, -150, 0);
  for (let i = 0; i < 6; i++) o.push({ x0: P0[0], y0: P0[1], vx: (r() - .35) * 1100, vy: -(500 + r() * 900), w: (r() - .5) * 14, a0: r() * 6, len: 140 + r() * 200, bend: (r() - .5) * 120, col: i > 2 ? '#e9ecf0' : '#d3b866' });
  return o;
})();
const CHIPS = (function () {
  const r = rng(3), o = []; const P0 = gw(IMPACT.P, -150, 120);
  for (let i = 0; i < 46; i++) { const a = -Math.PI * (.05 + r() * .9); const sp = 350 + r() * 1300; o.push({ x0: P0[0] + (r() - .5) * 120, y0: P0[1] - r() * 30, vx: Math.cos(a) * sp * (r() < .5 ? 1 : 1.2), vy: Math.sin(a) * sp, w: (r() - .5) * 30, s: 6 + r() * 14, c: ['#d98b3a', '#a8601c', '#f2a64f', '#5a3210'][i % 4] }); }
  return o;
})();
function simBodies(list, simT) {
  const dt = 1 / 120, n = Math.floor(simT / dt);
  return list.map(p => {
    let x = p.x0, y = p.y0, vx = p.vx, vy = p.vy, a = p.a0 ?? IMPACT.th, w = p.w, ph = p.ph ?? 10;
    for (let i = 0; i < n; i++) {
      vy += 2600 * dt; x += vx * dt; y += vy * dt; a += w * dt;
      if (y > FLOOR - ph) { y = FLOOR - ph; vy = Math.abs(vy) < 160 ? 0 : -vy * .36; vx *= .75; w *= .6; }
      if (y >= FLOOR - ph - 1) vx *= .992;
    }
    return { x, y, a };
  });
}

function drawStanding(t, pose, broke) {
  const post = Math.max(0, t - T_SLAM);
  const lean = broke ? lerp(.35, .5, eOut(seg(post, 0, .6))) : pose.lean;
  const rot = (a, x, y) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
  const heave = broke ? Math.sin(post * 14) * 5 * Math.exp(-post * 1.2) : 0;
  const hip = HIP;
  // רגליים
  limb([[hip[0] - 40, hip[1]], [hip[0] - 70, 1330], [hip[0] - 62, 1450]], 78, C.jeans);
  limb([[hip[0] + 40, hip[1]], [hip[0] + 78, 1330], [hip[0] + 92, 1450]], 78, C.jeans);
  ctx.fillStyle = '#f2f2f2'; ctx.beginPath(); ctx.ellipse(hip[0] - 50, 1452, 62, 24, 0, 0, 7); ctx.ellipse(hip[0] + 112, 1452, 62, 24, 0, 0, 7); ctx.fill();
  // גו
  const sOff = rot(lean, 0, -300), S = [hip[0] + sOff[0], hip[1] + sOff[1] + heave];
  ctx.save(); ctx.fillStyle = C.shirt; ctx.beginPath();
  const bl = rot(lean, -105, -300), br = rot(lean, 105, -300);
  ctx.moveTo(hip[0] - 100, hip[1]); ctx.lineTo(hip[0] + 100, hip[1]); ctx.lineTo(hip[0] + br[0], hip[1] + br[1] + heave); ctx.lineTo(hip[0] + bl[0], hip[1] + bl[1] + heave); ctx.closePath(); ctx.fill(); ctx.restore();
  const Ls = [S[0] - Math.cos(lean) * 98, S[1] - Math.sin(lean) * 98 + 10], Rs = [S[0] + Math.cos(lean) * 98, S[1] + Math.sin(lean) * 98 + 10];
  // ראש
  const hOff = rot(lean * 1.3, 0, -112), Hd = [S[0] + hOff[0], S[1] + hOff[1]];
  limb([S, [S[0] + hOff[0] * .5, S[1] + hOff[1] * .5]], 50, C.skinD);
  circ(Hd[0], Hd[1], 80, C.skin);
  ctx.fillStyle = C.hair; ctx.beginPath(); ctx.arc(Hd[0], Hd[1] - 6, 84, Math.PI * 1.02, Math.PI * 1.98); ctx.quadraticCurveTo(Hd[0] + 60, Hd[1] - 62, Hd[0] - 80, Hd[1] - 18); ctx.fill();
  const yell = broke && post < .9;
  ctx.strokeStyle = C.hair; ctx.lineWidth = 9; ctx.lineCap = 'round';
  const hx = Hd[0], hy = Hd[1];
  ctx.beginPath(); ctx.moveTo(hx - 52, hy - 22); ctx.lineTo(hx - 12, hy - 8); ctx.moveTo(hx + 52, hy - 22); ctx.lineTo(hx + 12, hy - 8); ctx.stroke(); // גבות כועסות
  ctx.lineWidth = 8;
  if (broke) { ctx.beginPath(); ctx.moveTo(hx - 40, hy + 4); ctx.lineTo(hx - 18, hy + 4); ctx.moveTo(hx + 40, hy + 4); ctx.lineTo(hx + 18, hy + 4); ctx.stroke(); }
  else { circ(hx - 28, hy + 6, 7, C.hair); circ(hx + 28, hy + 6, 7, C.hair); }
  if (yell) { ctx.fillStyle = '#3a0d0d'; ctx.beginPath(); ctx.ellipse(hx, hy + 44, 26, 22, 0, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(hx - 24, hy + 44); ctx.quadraticCurveTo(hx, hy + 34, hx + 24, hy + 46); ctx.stroke(); }
  // ידיים
  let h1, h2;
  if (!broke) { h1 = gw(pose.P, GR - 45, 0); h2 = gw(pose.P, GR + 45, 0); }
  else { h1 = [IMPACT.G[0] - 20, IMPACT.G[1] - 45]; h2 = [IMPACT.G[0] + 10, IMPACT.G[1] + 45 - 20 * eOut(seg(post, 0, .5))]; }
  const k1 = arm(Ls, h1, [-1, .6]), k2 = arm(Rs, h2, [1, .7]);
  circ(k1[0], k1[1], 33, C.skin); circ(k2[0], k2[1], 33, C.skin);
}

function drawHook(t) {
  const post = t - T_SLAM;
  // רעידת מסך
  let sx = 0, sy = 0;
  if (post > 0) { const a = 38 * Math.exp(-post * 7); sx = Math.sin(post * 83) * a; sy = Math.cos(post * 71) * a * .7; }
  const dx = t - T_X; if (dx > 0 && dx < .6) { const a = 18 * Math.exp(-dx * 9); sx += Math.sin(dx * 90) * a; sy += Math.cos(dx * 77) * a; }
  const zoom = 1 + (post > 0 ? .07 * Math.exp(-post * 6) : 0);
  ctx.save(); ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  // רקע: במה כהה + זרקור
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0b0f1a'); bg.addColorStop(1, '#171122'); ctx.fillStyle = bg; ctx.fillRect(-100, -100, W + 200, H + 200);
  const sp = ctx.createRadialGradient(430, 700, 40, 430, 900, 900); sp.addColorStop(0, 'rgba(255,214,150,.30)'); sp.addColorStop(1, 'rgba(255,214,150,0)'); ctx.fillStyle = sp; ctx.fillRect(-100, -100, W + 200, H + 200);
  const fl = ctx.createLinearGradient(0, FLOOR, 0, H); fl.addColorStop(0, '#5b3a20'); fl.addColorStop(1, '#2a180c'); ctx.fillStyle = fl; ctx.fillRect(-100, FLOOR, W + 200, H);
  ctx.strokeStyle = '#00000055'; ctx.lineWidth = 3; for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.moveTo(-100, FLOOR + 30 + i * i * 6 + i * 20); ctx.lineTo(W + 100, FLOOR + 30 + i * i * 6 + i * 20); ctx.stroke(); }
  ctx.fillStyle = '#00000066'; ctx.fillRect(-100, FLOOR - 3, W + 200, 6);

  const pose = hookPose(Math.min(t, T_SLAM));
