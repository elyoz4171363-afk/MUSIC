:root{--bg:#0a0b16;--ink:#f4f1ea;--mut:#9a99ad;--acc:#ffd54a;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Rubik,Heebo,system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:14px 16px;background:radial-gradient(1200px 700px at 50% -10%,#241d4a 0,#0a0b16 60%)}
.stage{position:relative;height:min(84vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px var(--line);background:#000}
canvas{width:100%;height:100%;display:block;cursor:pointer}
.start,.again{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(180deg,rgba(8,8,22,.35),rgba(8,8,22,.66));cursor:pointer;transition:opacity .25s}
.hide{opacity:0;pointer-events:none}
.big{width:104px;height:104px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 10px 40px rgba(255,213,74,.45);transition:transform .15s}
.start:hover .big,.again:hover .big{transform:scale(1.06)}
.big svg{width:44px;height:44px;fill:#1a1030;margin-inline-start:-4px}
.start h1{margin:0;font-size:clamp(22px,4.2vh,36px);font-weight:900;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.start p{margin:0;font-size:clamp(14px,2vh,18px);color:#e6e2f5;font-weight:500}
.bar{width:min(560px,100%);display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.bar button{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--ink)}
.bar button:hover{background:rgba(255,255,255,.1)}
.bar button:focus-visible{outline:2px solid var(--acc)}
.bar svg{width:22px;height:22px;fill:currentColor}
#seek{flex:1;accent-color:var(--acc);direction:ltr;height:28px}
#time{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px;min-width:84px;text-align:center;direction:ltr}
#mute.off{color:#ff6b6b}
.rec{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;background:var(--acc);color:#1a1030;font-weight:700;font-size:14px}
.rec.busy{background:#ff6b6b;color:#fff;pointer-events:none}
.rec svg{width:18px;height:18px;fill:currentColor}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.note{color:var(--mut);font-size:13px;text-align:center;max-width:560px;line-height:1.5}
@media (max-width:520px){.bar{padding:8px 10px;gap:6px}#time{min-width:70px;font-size:12px}}
</style>
</head>

<div class="stage">
  <canvas id="stage" width="1080" height="1920" aria-label="סרטון: ניקוי הפסנתר, פתיחתו ושיעור ארפג'יו"></canvas>
  <div class="start" id="start" role="button" aria-label="הפעלה">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></div>
    <h1>טיפ למוזיקאים</h1>
    <p>הפעלה עם סאונד · ארפג'יו בשלושה צעדים</p>
  </div>
  <div class="again hide" id="again" role="button" aria-label="לנגן שוב">
    <div class="big"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg></div>

  </div>
</div>
<div class="bar" dir="ltr">

  <button id="restart" aria-label="מההתחלה"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>

  <button id="mute" aria-label="השתקה"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg></button>
</div>

</div>
<p class="note">כל הסרטון, התמונה והסאונד, נוצר בקוד: אנימציית קנבס ופסנתר מסונתז ב-WebAudio. לחצו על "הורדה" כדי לשמור אותו כקובץ וידאו (ההקלטה מתבצעת בזמן אמת).</p>

  const ain = clamp(u / .28), bk = eback(clamp(u / .55));

  pill(W / 2, 110, 'טיפ למוזיקאים', 38, 'rgba(255,255,255,.1)', '#fff', 700, 'rgba(255,255,255,.28)');
  for (let i = 1; i <= 6; i++) { const x = W / 2 + (3.5 - i) * 46, on = si === i, done = si > i; ctx.fillStyle = on ? ACC : done ? 'rgba(255,213,74,.5)' : 'rgba(255,255,255,.2)'; ctx.beginPath(); ctx.arc(x, 178, on ? 11 : 8, 0, 6.3); ctx.fill(); }
  // heading
  txt(st.k, W / 2, 250, 38, 700, ACC, { alpha: ain });
  ctx.save(); ctx.translate(W / 2, 370); const sc = .8 + .2 * bk; ctx.scale(sc, sc); ctx.globalAlpha = ain;
  const ts = fitSize(st.title, 900, 940, 132);
  ctx.font = `900 ${ts}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = 'rtl';
  ctx.shadowColor = 'rgba(255,190,80,.55)'; ctx.shadowBlur = 40; ctx.fillStyle = lg(0, -ts / 2, 0, ts / 2, [[0, '#ffffff'], [1, '#ffd88a']]); ctx.fillText(st.title, 0, 0); ctx.restore();
  txt(st.sub, W / 2, 480, st.subDir ? 74 : fitSize(st.sub, 500, 900, 50), st.subDir ? 900 : 500, 'rgba(255,255,255,.88)', { alpha: clamp((u - .15) / .3), dir: st.subDir || 'rtl' });

  // lane
  const HL = TK.top, LT = TK.laneTop;
  ctx.save(); rr(40, LT, 1000, HL - LT, 30); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.045)'; ctx.fillRect(40, LT, 1000, HL - LT);
  for (let i = 0; i < 15; i++) { if (i % 2 === 0) { ctx.fillStyle = 'rgba(255,255,255,.025)'; ctx.fillRect(tkx(i), LT, TK.kw, HL - LT); } }
  ctx.fillStyle = lg(0, LT, 0, LT + 120, [[0, 'rgba(11,13,30,1)'], [1, 'rgba(11,13,30,0)']]); ctx.fillRect(40, LT, 1000, 120);
  // metronome
  if (si === 6) drawMetronome(t, lt);
  // thumb-under glow
  // bars
  const active = new Map();
  TN.forEach(n => {
    const yb = Math.min(HL, HL - (n.t - t) * TK.speed), yt = Math.min(yb - 34, HL - (n.t + n.d - t) * TK.speed);
    if (yt > HL || yb < LT - 40) return;
    const i = idxT(n.m), x = tkx(i) + 6, w = TK.kw - 12, on = t >= n.t && t <= n.t + Math.max(n.d, .22);
    if (on) active.set(i, n);
    const g = lg(0, yt, 0, yb, [[0, n.col + 'cc'], [1, n.col]]);
    ctx.shadowColor = n.col; ctx.shadowBlur = on ? 32 : 12; rr(x, yt, w, yb - yt, 16); ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x + 5, yt + 4, 9, Math.max(0, yb - yt - 8), 5); ctx.fill();
    if (yb - yt > 46) txt(n.f ? String(n.f) : SOL[idxT(n.m) % 7 >= 0 ? (idxT(n.m) % 7 + 7) % 7 : 0], x + w / 2, yb - 24, n.f ? 34 : 24, 900, 'rgba(10,10,30,.88)', { dir: 'ltr' });
  });
  ctx.restore();
  // ribbon for relaxed flow
  if (si === 5) drawRibbon(t);
  // beams
  active.forEach((n, i) => { const x = tkx(i); ctx.fillStyle = lg(0, HL, 0, HL - 300, [[0, n.col + '88'], [1, n.col + '00']]); ctx.fillRect(x + 4, HL - 300, TK.kw - 8, 300); });

  // keyboard
  for (let i = 0; i < 15; i++) {
    const x = tkx(i), n = active.get(i), dw = n ? 7 : 0;
    ctx.save(); rr(x + 2, TK.top + dw, TK.kw - 4, TK.wh - dw, [0, 0, 14, 14]);
    ctx.fillStyle = n ? lg(0, TK.top, 0, TK.top + TK.wh, [[0, n.col], [1, '#ffffff']]) : lg(0, TK.top, 0, TK.top + TK.wh, [[0, '#e9e2d2'], [.1, '#fbf8f0'], [1, '#ece6d6']]);

    txt(SOL[((i % 7) + 7) % 7], x + TK.kw / 2, TK.top + TK.wh - 36, 26, 700, n ? 'rgba(10,10,30,.8)' : used ? '#5b5340' : '#aaa089');
  }

    for (let k = 0; k < 7; k++) { const an = -Math.PI / 2 + (k - 3) * .38, r = 80 * eout(dt / .6) + 6; ctx.fillStyle = n.col; ctx.globalAlpha = (1 - dt / .6) * .9; ctx.beginPath(); ctx.arc(cx + Math.cos(an) * r, HL + Math.sin(an) * r * 1.2, 4 * (1 - dt / .6) + 1, 0, 6.3); ctx.fill(); }
    ctx.globalAlpha = 1;
  });
  active.forEach((n, i) => {
    if (!n.f) return; const dt = clamp((t - n.t) / .2), cx = tkx(i) + TK.kw / 2, y = TK.top + TK.wh - 120;
    ctx.save(); ctx.translate(cx, y); ctx.scale(.4 + .6 * eback(dt), .4 + .6 * eback(dt)); ctx.fillStyle = '#10112a'; ctx.beginPath(); ctx.arc(0, 0, 28, 0, 6.3); ctx.fill(); ctx.strokeStyle = n.col; ctx.lineWidth = 5; ctx.stroke(); txt(String(n.f), 0, 2, 36, 900, n.col, { dir: 'ltr' }); ctx.restore();
  });
  if (si === 4) drawThumbUnder(t, lt);

  // hint
  if (st.hint) { const a = eout(clamp((u - .3) / .5)); ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 30); const hs = fitSize(st.hint, 700, 860, 52); pill(W / 2, 1822, st.hint, hs, 'rgba(255,255,255,.1)', '#fff', 700, 'rgba(255,255,255,.28)'); ctx.restore(); }
  // outro

}
function drawThumbUnder(t, lt) {
  const p = eio(seg(lt, 18.0, 18.75)), fade = 1 - seg(lt, 19.9, 20.8); if (p <= 0 || fade <= 0) return;
  const x1 = tkx(idxT(67)) + TK.kw / 2, x2 = tkx(idxT(72)) + TK.kw / 2, y0 = TK.top + TK.wh + 22, yc = y0 + 100;
  const pt = u => { const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u; return [a * x1 + b * (x1 + x2) / 2 + c * x2, a * y0 + b * yc + c * y0]; };
  ctx.save(); ctx.globalAlpha = fade; ctx.strokeStyle = FC[1]; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.setLineDash([2, 18]); ctx.beginPath();
  for (let k = 0; k <= 30; k++) { const q = pt(k / 30 * p); k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); } ctx.stroke(); ctx.setLineDash([]);
  const q = pt(p);
  ctx.fillStyle = '#10112a'; ctx.beginPath(); ctx.arc(q[0], q[1], 32, 0, 6.3); ctx.fill(); ctx.strokeStyle = FC[1]; ctx.lineWidth = 6; ctx.stroke();
  txt('1', q[0], q[1] + 2, 42, 900, FC[1], { dir: 'ltr' });
  // start 3 badge
  ctx.fillStyle = '#10112a'; ctx.beginPath(); ctx.arc(x1, y0, 28, 0, 6.3); ctx.fill(); ctx.strokeStyle = FC[3]; ctx.lineWidth = 5; ctx.stroke(); txt('3', x1, y0 + 2, 36, 900, FC[3], { dir: 'ltr' });
  txt('האגודל עובר מתחת', (x1 + x2) / 2, yc + 6, 36, 700, '#fff', { alpha: seg(lt, 18.2, 18.7) });
  ctx.restore();
}
function drawRibbon(t) {
  const pts = []; TN.forEach(n => { const lt = n.t - T0; if (lt < 21.1 || lt > 25.2) return; const y = TK.top - (t - n.t) * TK.speed; if (y > TK.top + 20 || y < TK.laneTop) return; pts.push([tkx(idxT(n.m)) + TK.kw / 2, y]); });
  if (pts.length < 2) return;
  ctx.save(); rr(40, TK.laneTop, 1000, TK.top - TK.laneTop, 30); ctx.clip();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  [[26, 'rgba(120,200,255,.18)'], [12, 'rgba(255,255,255,.85)']].forEach(([w, c]) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length - 1; i++) { const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2; ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my); } ctx.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]); ctx.stroke(); });
  ctx.restore();
}
function drawMetronome(t, lt) {

  let ang = -.5; if (idx >= 0) { const a = (idx % 2 ? .5 : -.5) * -1, nxt = METRO[idx + 1]; if (nxt) { const u = eio(seg(lt, METRO[idx], nxt)); ang = lerp(a, -a, u); } else ang = a; ang = idx % 2 ? ang : ang; }
  ctx.save(); ctx.translate(bx, by);
  ctx.fillStyle = lg(-90, 0, 90, 0, [[0, '#9b6a3a'], [.5, '#d8a468'], [1, '#8a5a30']]); ctx.beginPath(); ctx.moveTo(-96, 0); ctx.lineTo(96, 0); ctx.lineTo(40, -430); ctx.lineTo(-40, -430); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(20,10,0,.35)'; ctx.fillRect(-18, -380, 36, 330);
  ctx.strokeStyle = '#f7f1e4'; ctx.lineWidth = 8; ctx.lineCap = 'round'; const L = 340, sx = Math.sin(ang * .6) * L, sy = -52 - Math.cos(ang * .6) * L;

function drawOutro(t, u) {

  txt('עקבו לעוד טיפים', 0, -14, 64, 900, '#1a1030'); txt('למוזיקאים', 0, 46, 52, 700, '#1a1030');

/* ----- transitions ----- */
function keysWipe(p, drawA, drawB) {
  drawA();
  ctx.save(); ctx.beginPath(); const n = 18, bw = W / n;
  for (let i = 0; i < n; i++) { const q = clamp(p * 1.7 - (i % 2 ? .35 : 0) - i * .028); ctx.rect(i * bw, 0, bw + 1, H * eio(q)); }
  ctx.clip(); drawB(); ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.9)'; for (let i = 0; i < n; i++) { const q = clamp(p * 1.7 - (i % 2 ? .35 : 0) - i * .028); if (q > 0 && q < 1) ctx.fillRect(i * bw, H * eio(q) - 6, bw, 6); }
}

/* ======================================================================
   רינדור ראשי, נגן וממשק
   ====================================================================== */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
  if (t < T0 - .8) drawRoomScene(t);
  else if (t < T0) keysWipe(seg(t, T0 - .8, T0), () => drawRoomScene(t), () => drawTeach(t));
  else drawTeach(t);
  const fl = clamp(1 - Math.abs(t - CUT) / .26); if (fl > 0) { ctx.fillStyle = `rgba(255,248,226,${eio(fl)})`; ctx.fillRect(0, 0, W, H); }
  const fin = clamp((t - (END - .7)) / .7); if (fin > 0) { ctx.fillStyle = `rgba(8,8,20,${fin})`; ctx.fillRect(0, 0, W, H); }
  const fi = 1 - clamp(t / .5); if (fi > 0) { ctx.fillStyle = `rgba(0,0,0,${fi})`; ctx.fillRect(0, 0, W, H); }

window.__render = t => render(t);
window.__END = END;

/* ---------- player ---------- */
const $ = id => document.getElementById(id);
const P = { playing: false, t: 0, from: 0, wall: 0, recording: false };
function nowT() {
  if (!P.playing) return P.t;
  const c = AE.clock(); if (c != null) return Math.max(P.from, c);
  return P.from + (performance.now() - P.wall) / 1000;
}
function setUI() {
  $('playIcon').style.display = P.playing ? 'none' : 'block'; $('pauseIcon').style.display = P.playing ? 'block' : 'none';
  $('start').classList.toggle('hide', P.playing || P.t > .05);
  $('again').classList.toggle('hide', !(P.t >= END - .01 && !P.playing));
}
function play(from) {
  if (from == null) from = P.t >= END - .05 ? 0 : P.t;
  AE.init(); if (AE.ctx && AE.ctx.state === 'suspended') AE.ctx.resume();
  P.from = from; P.t = from; P.playing = true; P.wall = performance.now();
  if (AE.ctx) AE.begin(from);
  setUI();
}
function pause() { if (!P.playing) return; P.t = nowT(); P.playing = false; AE.stop(); setUI(); }
function seek(t) { t = clamp(t, 0, END); P.t = t; if (P.playing) play(t); else { render(t); setUI(); } }
function toggle() { P.playing ? pause() : play(); }
function fmt(t) { t = Math.max(0, t); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); }
function tick() {
  let t = nowT();
  if (P.playing && t >= END) { P.playing = false; P.t = END; t = END; if (!P.recording) { /* let the tail ring */ } setUI(); if (P.recording) finishRec(); }
  render(t);
  $('seek').value = String(Math.round(t / END * 1000)); $('time').textContent = fmt(t) + ' / ' + fmt(END);
  requestAnimationFrame(tick);
}
$('start').addEventListener('click', () => play(0));
$('again').addEventListener('click', () => play(0));
$('toggle').addEventListener('click', toggle);
$('restart').addEventListener('click', () => { if (P.playing) play(0); else { P.t = 0; render(0); setUI(); } });
$('seek').addEventListener('input', e => seek(e.target.value / 1000 * END));
$('mute').addEventListener('click', () => { AE.init(); AE.setMute(!AE.muted); $('mute').classList.toggle('off', AE.muted); });
cv.addEventListener('click', toggle);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); toggle(); } });

/* ---------- export to WebM (video + synthesized audio) ---------- */
let rec = null, chunks = [];
function startRec() {
  if (!window.MediaRecorder || !cv.captureStream) { alert('הדפדפן הזה לא תומך בהקלטה. נסו Chrome במחשב.'); return; }
  AE.init(); AE.ctx.resume();
  const vs = cv.captureStream(30), as = AE.rec.stream, mixed = new MediaStream([...vs.getVideoTracks(), ...as.getAudioTracks()]);
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
  rec = new MediaRecorder(mixed, { mimeType: mime, videoBitsPerSecond: 9e6, audioBitsPerSecond: 192e3 }); chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { const url = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })), a = document.createElement('a'); a.href = url; a.download = 'piano-arpeggio-tip.webm'; document.body.appendChild(a); a.click(); a.remove(); $('rec').classList.remove('busy'); $('recLabel').textContent = 'הורדה (WebM)'; P.recording = false; };
  P.recording = true; rec.start(250); $('rec').classList.add('busy'); $('recLabel').textContent = 'מקליט… אל תסגרו את הלשונית';
  play(0);
}

$('rec').addEventListener('click', () => { if (P.recording) return; startRec(); });

/* ---------- offline audio render (used for the MP4 export) ---------- */
window.__renderAudio = async function () {
  const sr = 44100, oc = new OfflineAudioContext(2, Math.ceil((END + 3) * sr), sr), s = makeSession(oc, makeNoise(oc), makeIR(oc), 0, 0);
  s.out.connect(oc.destination);

    const l = L[i] * fade, r = Rr[i] * fade; peak = Math.max(peak, Math.abs(l), Math.abs(r)); sum += l * l + r * r;

/* ---------- boot ---------- */
(async function boot() {
  try { await Promise.all(['500', '700', '900'].map(w => document.fonts.load(`${w} 40px Rubik`, 'אבג1'))); } catch (e) { }
  render(2.4); setUI(); window.__ready = true;
  if (!window.__noLoop) requestAnimationFrame(tick);
})();
