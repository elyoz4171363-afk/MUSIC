<figure class="fig">
<svg viewBox="0 0 700 400" role="img" aria-label="תרשים החזר השקעה: הכנסות המאסטר זורמות תחילה לדלי שמכיל את המקדמה ואת עלויות ההקלטה, הקליפ והשיווק. רק אחרי שהדלי מתמלא מתחילים אחוזי המפיק להגיע לכיס שלו.">
  <defs>
    <marker id="rc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--gold)"/>
    </marker>
    <marker id="rc-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--ink3)"/>
    </marker>
  </defs>

  <!-- source, on the right (RTL reading) -->
  <rect x="520" y="20" width="160" height="52" rx="10" fill="var(--panel)" stroke="var(--gold-deep)"/>
  <text x="600" y="43" text-anchor="middle" font-size="16" font-weight="700" fill="var(--gold-l)" direction="rtl">הכנסות השיר</text>
  <text x="600" y="61" text-anchor="middle" font-size="12.5" fill="var(--ink2)" direction="rtl">סטרימינג · מכירות · סינכרון</text>

  <path d="M600 72 L600 104" stroke="var(--gold)" fill="none" marker-end="url(#rc-ar)"/>

  <!-- the bucket -->
  <rect x="170" y="110" width="430" height="168" rx="12" fill="#2a1a18" stroke="#4a2e28"/>
  <text x="585" y="134" text-anchor="start" font-size="16" font-weight="700" fill="#f0a585" direction="rtl">הדלי שצריך להתמלא</text>
  <text x="585" y="153" text-anchor="start" font-size="12.5" fill="var(--ink2)" direction="rtl">Recoupment — לפני שרואים שקל נוסף</text>

  <rect x="188" y="166" width="394" height="32" rx="7" fill="rgba(240,165,133,0.12)" stroke="#4a2e28"/>
  <text x="568" y="187" text-anchor="start" font-size="14" fill="#f3c5b1" direction="rtl">המקדמה שקיבלתם</text>
  <text x="204" y="187" text-anchor="end" font-size="12.5" fill="var(--ink3)" direction="rtl">כבר בכיס — לא כסף אבוד</text>

  <rect x="188" y="204" width="394" height="32" rx="7" fill="rgba(240,165,133,0.12)" stroke="#4a2e28"/>
  <text x="568" y="225" text-anchor="start" font-size="14" fill="#f3c5b1" direction="rtl">הקלטות · קליפ · שיווק · קידום</text>

  <rect x="188" y="242" width="394" height="26" rx="7" fill="none" stroke="#4a2e28" stroke-dasharray="5 4"/>
  <text x="568" y="260" text-anchor="start" font-size="13" fill="#d07a5a" direction="rtl">״עלויות סבירות שייקבעו על ידי החברה״ — הסעיף שאין לו תחתית</text>

  <!-- break-even gate -->
  <path d="M170 194 L118 194" stroke="var(--ink3)" fill="none" marker-end="url(#rc-dim)"/>
  <text x="88" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="var(--gold-l)" direction="rtl">נקודת</text>
  <text x="88" y="199" text-anchor="middle" font-size="13" font-weight="700" fill="var(--gold-l)" direction="rtl">האיזון</text>
  <path d="M88 210 L88 300" stroke="var(--gold)" fill="none" stroke-dasharray="4 4"/>
  <text x="88" y="222" text-anchor="middle" font-size="11.5" fill="var(--ink3)">Break-even</text>

  <!-- after break-even -->
  <path d="M385 278 L385 312" stroke="var(--gold)" fill="none" marker-end="url(#rc-ar)"/>
  <text x="400" y="300" text-anchor="end" font-size="12.5" fill="var(--ink2)" direction="rtl">רק אחרי שהדלי מלא</text>

  <rect x="225" y="318" width="320" height="50" rx="10" fill="#16261c" stroke="#4cc488"/>
  <text x="385" y="341" text-anchor="middle" font-size="16" font-weight="700" fill="#5cd49a" direction="rtl">אחוזי המפיק מגיעים אליכם</text>
  <text x="385" y="359" text-anchor="middle" font-size="12.5" fill="var(--ink2)" direction="rtl">מכאן והלאה, כל עוד השיר מייצר</text>

  <text x="350" y="390" text-anchor="middle" font-size="13" fill="var(--ink3)" direction="rtl">ככל שרשימת העלויות בדלי ארוכה יותר, כך נדחק הרגע שבו תראו כסף</text>
</svg>
<figcaption>למה אחוז גבוה לא שווה כלום בלי רשימת קיזוזים סגורה: הדלי נמצא בין ההכנסות לבינכם, ומי שמגדיר מה נכנס אליו קובע מתי תתחילו לקבל.</figcaption>
</figure>
